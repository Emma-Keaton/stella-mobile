plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.22'
    id 'com.facebook.react'
}

android {
    namespace = 'com.stellamobile.app'
    compileSdk = 34

    defaultConfig {
        applicationId 'com.stellamobile.app'
        minSdk = 24
        targetSdk = 34
        versionCode 1
        versionName '1.0.0'

        vectorDrawables {
            useSupportLibrary true
        }

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    def keystorePropertiesFile = rootProject.file('keystore.properties')
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file(keystoreProperties['STORE_FILE'] ?: 'android/app/stella-mobile-upload-key.keystore')
            storePassword keystoreProperties['STORE_PASSWORD'] ?: System.env.APP_RELEASE_STORE_PASSWORD ?: ''
            keyAlias keystoreProperties['KEY_ALIAS'] ?: System.env.KEY_ALIAS ?: 'stella-mobile-keystore'
            keyPassword keystoreProperties['KEY_PASSWORD'] ?: System.env.APP_RELEASE_KEY_PASSWORD ?: ''
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
        excludes += [
            '**/libcppcore.so',
            '**/libfbjni.so',
        ]
    }
}

react {
    autolinkLibrariesWithApp()
}

dependencies {
    implementation 'com.facebook.react:react-android'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
}
